<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب - QR4U</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><div class="container"><a class="logo" href="index.html">QR4U</a></div></header><main class="container"><div class="card form-card"><h2>إنشاء حساب</h2><div id="msg" class="notice"></div><form id="form"><div class="field"><label>الاسم الكامل</label><input id="name" required></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="6" required></div><button class="btn btn-primary" type="submit">إنشاء الحساب</button></form><p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const{data,error}=await QR4U.sb.auth.signUp({email:email.value,password:password.value});if(error)return QR4U.show('msg',error.message);if(data.user){const r=await QR4U.sb.from('profiles').upsert({id:data.user.id,full_name:name.value,phone:phone.value});if(r.error)return QR4U.show('msg',r.error.message)}QR4U.show('msg','تم إنشاء الحساب. إذا طُلب تأكيد البريد، راجع بريدك الإلكتروني.','success');setTimeout(()=>location.href='login.html',1500)}</script></body></html>
