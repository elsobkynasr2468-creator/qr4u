<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة سيارة - QR4U</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><div class="card form-card"><a class="logo" href="dashboard.html">QR4U</a><h2>إضافة سيارة</h2><div id="msg" class="notice"></div><form id="form"><div class="field"><label>رقم اللوحة</label><input id="plate" required></div><div class="field"><label>نوع السيارة</label><input id="type"></div><div class="field"><label>الموديل</label><input id="model"></div><div class="field"><label>اللون</label><input id="color"></div><button class="btn btn-primary">حفظ وإنشاء QR</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const{data:u}=await QR4U.sb.auth.getUser();if(!u.user)return location.href='login.html';const car={user_id:u.user.id,plate_number:plate.value,car_type:type.value,car_model:model.value,car_color:color.value,is_active:true};let r=await QR4U.sb.from('cars').insert(car).select().single();if(r.error)return QR4U.show('msg',r.error.message);const code='QR4U-'+crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase();r=await QR4U.sb.from('qr_codes').insert({car_id:r.data.id,code}).select().single();if(r.error)return QR4U.show('msg',r.error.message);QR4U.show('msg','تم الحفظ. رابط السيارة: '+location.origin+'/car.html?code='+code,'success');form.reset()}</script></body></html>
