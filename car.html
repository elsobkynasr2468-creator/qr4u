<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيانات السيارة - QR4U</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><section id="loading" class="card car-hero">جاري تحميل بيانات السيارة...</section><section id="page" class="hidden"><div class="car-hero"><div id="avatar" class="avatar"></div><h1 id="title"></h1><div id="plate" class="plate"></div><p id="owner" class="muted"></p><div class="actions"><a id="call" class="btn btn-primary">اتصال</a><a id="wa" class="btn btn-light" target="_blank">واتساب</a></div></div><div class="grid"><div class="card"><h3>بيانات السيارة</h3><p>النوع: <b id="type"></b></p><p>الموديل: <b id="model"></b></p><p>اللون: <b id="color"></b></p></div><div class="card"><h3>إرسال رسالة للمالك</h3><div id="msg" class="notice"></div><form id="form"><div class="field"><label>اسمك (اختياري)</label><input id="vname"></div><div class="field"><label>هاتفك (اختياري)</label><input id="vphone"></div><div class="field"><label>الرسالة</label><textarea id="vmessage" required></textarea></div><button class="btn btn-primary">إرسال</button></form></div></div></section><section id="error" class="card hidden car-hero"><h2>تعذر تحميل البيانات</h2><p id="err"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),code=p.get('code');if(!code)return fail('الرابط لا يحتوي على كود.');let r=await QR4U.sb.from('qr_codes').select('code,car_id').eq('code',code).maybeSingle();if(r.error||!r.data)return fail('الكود غير موجود.');r=await QR4U.sb.from('cars').select('*').eq('id',r.data.car_id).maybeSingle();if(r.error||!r.data)return fail('السيارة غير موجودة.');const car=r.data;if(car.is_active===false)return fail('هذه السيارة غير مفعلة حاليًا.');const pr=await QR4U.sb.from('profiles').select('full_name,phone').eq('id',car.user_id).maybeSingle();const profile=pr.data||{};title.textContent=(car.car_type||'سيارة')+' '+(car.car_model||'');plate.textContent=car.plate_number||'غير متوفر';type.textContent=car.car_type||'غير متوفر';model.textContent=car.car_model||'غير متوفر';color.textContent=car.car_color||'غير متوفر';owner.textContent='المالك: '+(profile.full_name||'غير متوفر');avatar.textContent=(profile.full_name||'م').trim().charAt(0);const phone=(profile.phone||'').replace(/[^0-9+]/g,'');if(phone){call.href='tel:'+phone;wa.href='https://wa.me/'+phone.replace('+','')}else{call.classList.add('hidden');wa.classList.add('hidden')}loading.classList.add('hidden');page.classList.remove('hidden');form.onsubmit=async e=>{e.preventDefault();const x=await QR4U.sb.from('visitor_messages').insert({car_id:car.id,visitor_name:vname.value||null,visitor_phone:vphone.value||null,message:vmessage.value});if(x.error)return QR4U.show('msg',x.error.message);QR4U.show('msg','تم إرسال الرسالة بنجاح.','success');form.reset()}})();function fail(x){loading.classList.add('hidden');err.textContent=x;error.classList.remove('hidden')}</script></body></html>
