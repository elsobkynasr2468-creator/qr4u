<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الرسائل - QR4U</title><link rel="stylesheet" href="style.css"></head><body><main class="container section"><a class="logo" href="dashboard.html">QR4U</a><h1>رسائل الزوار</h1><div id="msg" class="notice"></div><div id="list" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{const{data:u}=await QR4U.sb.auth.getUser();if(!u.user)return location.href='login.html';const{data,error}=await QR4U.sb.from('visitor_messages').select('*,cars(plate_number)').eq('cars.user_id',u.user.id).order('created_at',{ascending:false});if(error)return QR4U.show('msg',error.message);list.innerHTML=(data||[]).map(m=>`<div class="card"><h3>رسالة جديدة</h3><p>السيارة: ${QR4U.escape(m.cars?.plate_number||'')}</p><p>الاسم: ${QR4U.escape(m.visitor_name||'غير مذكور')}</p><p>الهاتف: ${QR4U.escape(m.visitor_phone||'غير مذكور')}</p><p>${QR4U.escape(m.message)}</p><small class="muted">${new Date(m.created_at).toLocaleString('ar-EG')}</small></div>`).join('')||'<p>لا توجد رسائل.</p>'})();</script></body></html>
