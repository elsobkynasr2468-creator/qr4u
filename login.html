<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - QR4U</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><div class="container"><a class="logo" href="index.html">QR4U</a></div></header><main class="container"><div class="card form-card"><h2>تسجيل الدخول</h2><div id="msg" class="notice"></div><form id="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn btn-primary" type="submit">دخول</button></form><p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const{error}=await QR4U.sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return QR4U.show('msg',error.message);location.href='dashboard.html'}</script></body></html>
