<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سياراتي - QR4U</title><link rel="stylesheet" href="style.css"></head><body><main class="container section"><a class="logo" href="dashboard.html">QR4U</a><h1>سياراتي</h1><div id="msg" class="notice"></div><div id="list" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{const{data:u}=await QR4U.sb.auth.getUser();if(!u.user)return location.href='login.html';const{data,error}=await QR4U.sb.from('cars').select('*,qr_codes(code)').eq('user_id',u.user.id).order('created_at',{ascending:false});if(error)return QR4U.show('msg',error.message);list.innerHTML=(data||[]).map(c=>{const code=c.qr_codes?.[0]?.code||'';return `<div class="card"><h3>${QR4U.escape(c.car_type||'سيارة')} ${QR4U.escape(c.car_model||'')}</h3><p>اللوحة: ${QR4U.escape(c.plate_number)}</p><p>اللون: ${QR4U.escape(c.car_color||'غير محدد')}</p><a class="btn btn-primary" target="_blank" href="car.html?code=${encodeURIComponent(code)}">فتح صفحة QR</a></div>`}).join('')||'<p>لا توجد سيارات بعد.</p>'})();</script></body></html>
